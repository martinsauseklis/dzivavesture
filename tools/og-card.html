<!doctype html>
<meta charset="utf-8">
<!--
  Source for public/og.png — the link-preview card (1200×630).

  One real post, shown the way the page shows it: the product in a single
  frame, not a poster about it. Rendered in Chrome so it uses the
  very same font files and tokens as the page and cannot drift from it.
  Pattern taken from ~/dev/mai-lv/tools/og-card.sh.

  The post is seq 610 in src/data/18-11-1918.json (Ulmanis, 17.00) — copied
  verbatim; if that record changes, change this.
  The avatar hue is avatarHue('@k_ulmanis') = h-5 in public/feed.css.

  REGENERATE:  bash tools/og-card.sh
  Then keep <meta property="og:image:alt"> in src/pages/index.astro in step.
-->
<link rel="stylesheet" href="../public/fonts/fonts.css">
<style>
  /* Same tokens as public/feed.css — do not re-pick these by eye. */
  :root { --bg:#ffffff; --ink:#15181c; --soft:#5d646c; --line:#e5e7ea; --accent:#b01f2e; --accent-tint:#fbeef0; --rep:#9a5100; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:var(--bg); color:var(--ink);
         font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:44px 80px 0; justify-content:flex-start;
         display:flex; flex-direction:column; }
  /* 1200 px shrinks to 360 px in a phone's share sheet, a factor of 3.33 —
     so 40 px here is 12 px there, the smallest size still readable; the quote
     at 50 px is 15 px there, the size of the page's own text. */
  .top { display:flex; justify-content:space-between; align-items:baseline; font-size:34px; color:var(--soft);
         padding-bottom:20px; border-bottom:2px solid var(--line); }
  .top b { color:var(--ink); font-weight:600; }
  .who { display:flex; gap:22px; align-items:center; margin-top:26px; }
  .avatar { width:84px; height:84px; border-radius:50%; background:#15803d; color:#fff; font-weight:600; font-size:32px;
            display:grid; place-items:center; flex:none; }
  .name { font-size:40px; font-weight:600; line-height:1.15; }
  .line { font-size:30px; color:var(--soft); margin-top:4px; display:flex; gap:16px; align-items:center; }
  .badge { font-size:26px; line-height:1; padding:8px 14px; border-radius:10px; font-weight:500; color:var(--rep);
           background:color-mix(in srgb, currentColor 11%, transparent); }
  .lv { font-size:58px; line-height:1.25; margin-top:40px; letter-spacing:-.01em; }
  .later { margin-top:auto; margin-bottom:0; background:var(--accent-tint); border-radius:22px 22px 0 0;
           padding:22px 34px 26px; font-size:32px; line-height:1.3; }
  .later b { display:block; color:var(--accent); font-weight:600; font-size:30px; margin-bottom:6px; }
</style>

<div class="top"><b>dzīvā vēsture</b><span>Pirmdiena, 18. novembris 1918 · Rīga</span></div>
<div class="who">
  <span class="avatar">KU</span>
  <div>
    <div class="name">Kārlis Ulmanis</div>
    <div class="line">@k_ulmanis · 17.00</div>
  </div>
</div>
<p class="lv">Latvijas valstij jābūt demokrātiski taisnai valstij, lai nedotu viņā vietas ne apspiešanai, ne netaisnībai.</p>
